<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0a0a0f">
    <title>Not found — Onelots</title>
    <link rel="icon" type="image/png" href="/img/onelots.png">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
        <symbol id="i-github" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></symbol>
        <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></symbol>
        <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></symbol>
    </svg>

    <!-- HEADER -->
    <header id="main-header" class="scrolled">
        <div class="container">
            <a href="/" class="logo">
                <!-- Good ol' Onelots pfp -->
                    <img 
                        src="/img/onelots.webp" 
                        alt="" 
                        class="project-org-logo"
                    >
                Onelots
            </a>
            <nav>
                <ul>
                    <li><a href="/">About</a></li>
                    <li><a href="/services.html">Services</a></li>
                    <li><a href="/contact.html">Contact</a></li>
                    <li><a href="/devices.html">Devices</a></li>
                    <li><a href="https://github.com/onelots" target="_blank" class="nav-cta">GitHub</a></li>
                </ul>
            </nav>
            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menu" aria-expanded="false" aria-controls="mobileNav">
                <svg class="feather" width="24" height="24" aria-hidden="true"><use href="#i-menu"/></svg>
            </button>
        </div>
    </header>

    <!-- MOBILE NAV -->
    <div class="mobile-nav" id="mobileNav">
        <div class="mobile-nav-header">
            <a href="/" class="logo">onelots<span>.</span></a>
            <button class="mobile-close" id="mobileClose" aria-label="Close">
                <svg class="feather" style="width:24px;height:24px;" width="24" height="24" aria-hidden="true"><use href="#i-x"/></svg>
            </button>
        </div>

        <nav class="mobile-nav-links">
            <a href="/"><span class="mn-num">01</span>About</a>
            <a href="/services.html"><span class="mn-num">02</span>Services</a>
            <a href="/contact.html"><span class="mn-num">03</span>Contact</a>
            <a href="/devices.html"><span class="mn-num">04</span>Devices</a>
        </nav>

        <div class="mobile-nav-footer">
            <a href="https://github.com/onelots" target="_blank" class="mn-github">
                <svg class="feather" width="24" height="24" aria-hidden="true"><use href="#i-github"/></svg> GitHub
            </a>
        </div>
    </div>

    <section class="page-hero">
        <div class="container">
            <div class="section-header">
                <p class="section-label">404</p>
                <h1 class="section-title">Page not found</h1>
                <p class="section-desc">This page does not exist, or not anymore.</p>
            </div>
            <a href="/" class="btn btn-primary">Back home</a>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <div class="container">
            <p>Built by <span>Onelots & Claude</span> (I am ashamed) · <a href="/contact.html">Contact</a></p>
        </div>
    </footer>

    <script>
        const header = document.getElementById('main-header');
        window.addEventListener('scroll', () => { header.classList.toggle('scrolled', window.scrollY > 50); });
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const mobileNav = document.getElementById('mobileNav');
        const mobileClose = document.getElementById('mobileClose');
        const setMenu = open => {
            mobileNav.classList.toggle('active', open);
            mobileMenuBtn.setAttribute('aria-expanded', open);
            document.body.style.overflow = open ? 'hidden' : '';
            (open ? mobileClose : mobileMenuBtn).focus();
        };
        mobileMenuBtn.addEventListener('click', () => setMenu(true));
        mobileClose.addEventListener('click', () => setMenu(false));
        document.querySelectorAll('.mobile-nav a').forEach(l => l.addEventListener('click', () => setMenu(false)));
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && mobileNav.classList.contains('active')) setMenu(false); });
    </script>
</body>
</html>
